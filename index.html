<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 채팅</title>
    <link rel="stylesheet" href="reset.css">

</head>

<body>
    <div id="app">
        <header>
            <h3>실시간 웹챗</h3>

        <ul id="messages" aria-live="polite"></ul>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="메시지를 입력하세요…" autocomplete="off" aria-label="메시지 입력">
            <button type="submit">전송</button>
        </form>
    </div>
    <script src="client.js"></script>
</body>

</html>
